<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>语音输入</title>
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="语音输入">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, 'Segoe UI', sans-serif;
    background: #0c0c10;
    color: #ece8e1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    user-select: none;
    -webkit-user-select: none;
  }
  .container {
    width: 100%;
    max-width: 360px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    flex: 1;
  }
  h1 { font-size: 22px; font-weight: 600; letter-spacing: 0.5px; }
  .subtitle { font-size: 13px; color: #8a857e; text-align: center; }

  /* ── 连接状态 ────────────────────────── */
  .conn-status {
    font-size: 11px; color: #5a5650;
    display: flex; align-items: center; gap: 6px;
  }
  .conn-dot {
    width: 8px; height: 8px; border-radius: 4px;
    background: #5a5650; transition: background 0.3s;
  }
  .conn-dot.connected { background: #4ecdc4; }
  .conn-dot.disconnected { background: #ff4d4d; }

  /* ── 输入框 ──────────────────────────── */
  .transcript-box {
    width: 100%;
    padding: 16px;
    border-radius: 14px;
    background: #16161f;
    border: 1px solid rgba(255,255,255,0.06);
    font-size: 18px;
    line-height: 1.8;
    color: #ece8e1;
    font-family: inherit;
    resize: none;
    outline: none;
    min-height: 260px;
    max-height: 70vh;
    transition: border-color 0.2s;
    flex: 1;
  }
  .transcript-box:focus {
    border-color: rgba(78,205,196,0.3);
  }
  .transcript-box::placeholder {
    color: #5a5650;
    font-size: 15px;
  }

  /* ── 按钮行 ──────────────────────────── */
  .actions { display: flex; gap: 10px; width: 100%; }
  .action-btn {
    flex: 1; padding: 14px; border: none; border-radius: 10px;
    font-size: 15px; font-weight: 600; cursor: pointer;
    transition: all 0.2s; font-family: inherit;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  .action-btn:active { transform: scale(0.97); }
  .action-btn.clear {
    flex: 0 0 auto; padding: 14px 18px;
    background: rgba(255,77,77,0.08); color: #ff5c5c;
  }
  .action-btn.clear:active { background: rgba(255,77,77,0.2); }
  .action-btn.send {
    background: rgba(78,205,196,0.12); color: #4ecdc4;
  }
  .action-btn.send:active { background: rgba(78,205,196,0.25); }
  .action-btn.send.sent { background: rgba(78,205,196,0.25); color: #2ecc71; }
  .action-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  /* ── 自动发送开关 ────────────────────── */
  .auto-toggle {
    width: 100%;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    font-size: 13px; color: #5a5650; cursor: pointer;
    padding: 4px 0;
    -webkit-tap-highlight-color: transparent;
  }
  .auto-toggle.active { color: #4ecdc4; }
  .auto-toggle input { display: none; }
  .switch {
    width: 36px; height: 20px; border-radius: 10px;
    background: #2a2a35; transition: background 0.2s; position: relative;
    flex-shrink: 0;
  }
  .switch::after {
    content: ''; position: absolute; top: 2px; left: 2px;
    width: 16px; height: 16px; border-radius: 8px;
    background: #5a5650; transition: all 0.2s;
  }
  .auto-toggle.active .switch { background: rgba(78,205,196,0.3); }
  .auto-toggle.active .switch::after {
    left: 18px; background: #4ecdc4;
  }

  /* ── 发送状态提示 ────────────────────── */
  .toast {
    font-size: 12px; color: #4ecdc4; min-height: 18px;
    transition: opacity 0.3s; opacity: 0;
  }
  .toast.show { opacity: 1; }

  /* ── 二维码区域 ──────────────────────── */
  details.qr-section { width: 100%; margin-top: 4px; }
  .qr-toggle {
    font-size: 12px; color: #5a5650; cursor: pointer;
    padding: 6px 0; user-select: none; text-align: center;
    -webkit-tap-highlight-color: transparent;
  }
  .qr-list { display: flex; flex-direction: column; gap: 12px; padding: 8px 0 4px; }
  .qr-item {
    background: #16161f; border-radius: 10px; padding: 10px;
    display: flex; align-items: center; gap: 10px;
  }
  .qr-item img { border-radius: 6px; flex-shrink: 0; background: #16161f; }
  .qr-item-info { flex: 1; min-width: 0; }
  .qr-item-url {
    font-size: 12px; color: #4ecdc4; word-break: break-all;
    display: block; margin-bottom: 2px;
  }
  .qr-item-name .tag {
    display: inline-block; padding: 1px 6px; border-radius: 3px;
    font-size: 10px; background: rgba(78,205,196,0.12); color: #4ecdc4;
  }
</style>
</head>
<body>
<div class="container">
  <h1>🎤 语音输入</h1>
  <p class="subtitle">用手机键盘的语音键说话，文字自动到电脑剪贴板</p>

  <!-- 连接状态 -->
  <div class="conn-status">
    <span class="conn-dot" id="connDot"></span>
    <span id="connText">连接中…</span>
  </div>

  <!-- 输入框（点击弹出键盘，用语音键说话） -->
  <textarea class="transcript-box" id="transcriptBox"
    placeholder="点这里，弹出键盘后按键盘上的🎤语音键说话&#10;&#10;识别的文字会出现在这里，然后自动发到电脑&#10;也可以直接打字编辑"></textarea>

  <!-- 按钮 -->
  <div class="actions">
    <button class="action-btn clear" id="clearBtn">🗑️</button>
    <button class="action-btn send" id="sendBtn">📋 发送到电脑</button>
  </div>

  <!-- 自动发送开关 -->
  <label class="auto-toggle" id="autoToggle">
    <span class="switch"></span>
    输入后自动发送（延迟 1 秒）
  </label>

  <!-- 状态提示 -->
  <div class="toast" id="toast">✅ 已发送到电脑剪贴板</div>

  <!-- 二维码 -->
  <details class="qr-section" id="qrSection">
    <summary class="qr-toggle">📡 扫码连接（手机扫下面的码）</summary>
    <div class="qr-list" id="qrList"></div>
  </details>
</div>

<script>
// ── WebSocket 连接 ──────────────────────────────
const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
const ws = new WebSocket(`${protocol}//${location.host}`);
const connDot = document.getElementById('connDot');
const connText = document.getElementById('connText');

ws.onopen = () => { connDot.className = 'conn-dot connected'; connText.textContent = '已连接'; };
ws.onclose = () => { connDot.className = 'conn-dot disconnected'; connText.textContent = '已断开，刷新重试'; };
ws.onerror = () => { connDot.className = 'conn-dot disconnected'; connText.textContent = '连接失败'; };

// ── DOM ──────────────────────────────────────────
const transcriptBox = document.getElementById('transcriptBox');
const sendBtn = document.getElementById('sendBtn');
const clearBtn = document.getElementById('clearBtn');
const autoToggle = document.getElementById('autoToggle');
const toast = document.getElementById('toast');

let autoSend = true;
let sendTimer = null;
let lastSentText = '';

// ── 发送到电脑 ────────────────────────────────
function sendText(text) {
  if (!text || !text.trim()) return;
  ws.send(JSON.stringify({ type: 'text', text: text.trim() }));
  lastSentText = text.trim();
  // 按钮反馈
  sendBtn.textContent = '✅ 已发送';
  sendBtn.classList.add('sent');
  setTimeout(() => {
    sendBtn.classList.remove('sent');
    sendBtn.textContent = '📋 发送到电脑';
  }, 1000);
  // 小提示
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1500);
}

// ── 输入框内容变化 → 自动发送 ────────────────
transcriptBox.addEventListener('input', () => {
  if (!autoSend) return;
  clearTimeout(sendTimer);
  // 内容变了且和上次发送的不同，等 1 秒没新输入就发送
  sendTimer = setTimeout(() => {
    const text = transcriptBox.value.trim();
    if (text && text !== lastSentText) sendText(text);
  }, 1000);
});

// ── 自动发送开关 ──────────────────────────────
autoToggle.addEventListener('click', () => {
  autoSend = !autoSend;
  autoToggle.classList.toggle('active', autoSend);
});

// ── 手动发送 ──────────────────────────────────
sendBtn.addEventListener('click', () => {
  const text = transcriptBox.value.trim();
  if (text) sendText(text);
});

// ── 清空 ──────────────────────────────────────
clearBtn.addEventListener('click', () => {
  transcriptBox.value = '';
  lastSentText = '';
  sendBtn.textContent = '📋 发送到电脑';
  sendBtn.classList.remove('sent');
});

// ── 键盘快捷键 ────────────────────────────────
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    const text = transcriptBox.value.trim();
    if (text) sendText(text);
  }
  if (e.key === 'Escape') {
    transcriptBox.value = '';
    lastSentText = '';
    sendBtn.textContent = '📋 发送到电脑';
    sendBtn.classList.remove('sent');
  }
});

// ── 自动发送默认开启 ──────────────────────────
autoToggle.classList.add('active');

// ── 二维码 ──────────────────────────────────────
fetch('/api/urls').then(r => r.json()).then(data => {
  const list = document.getElementById('qrList');
  data.urls.forEach(({ name, url }) => {
    const item = document.createElement('div');
    item.className = 'qr-item';
    const img = document.createElement('img');
    img.src = `/api/qr?url=${encodeURIComponent(url)}`;
    img.width = 72; img.height = 72;
    const info = document.createElement('div');
    info.className = 'qr-item-info';
    info.innerHTML = `
      <span class="qr-item-url">${url}</span>
      <span class="qr-item-name"><span class="tag">${name}</span></span>
    `;
    info.onclick = () => {
      navigator.clipboard.writeText(url).catch(() => {});
      info.innerHTML = `<span class="qr-item-url">✅ 已复制</span>`;
      setTimeout(() => {
        info.innerHTML = `
          <span class="qr-item-url">${url}</span>
          <span class="qr-item-name"><span class="tag">${name}</span></span>
        `;
      }, 1500);
    };
    item.appendChild(img);
    item.appendChild(info);
    list.appendChild(item);
  });
}).catch(() => {
  document.getElementById('qrSection').style.display = 'none';
});

// ── 注册 Service Worker ────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js');
}

console.log('🎤 语音输入已加载（纯输入框模式）');
</script>
</body>
</html>
